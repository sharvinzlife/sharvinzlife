<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 356" width="1200" height="356" fill="none" role="img" aria-label="Telemetry: source distribution across public and private repositories — Go 47.3 percent, Python 23.7 percent, TypeScript 18.8 percent, Shell 2.5 percent, JavaScript 2.2 percent, other 5.5 percent. Shipping since 2020, 10 languages shipped, 5 LLM providers routed, 24/7 production uptime.">
<defs>
<radialGradient id="tglow" cx="80%" cy="0%" r="85%">
  <stop offset="0%" stop-color="#0d3350" stop-opacity="0.45"/>
  <stop offset="100%" stop-color="#04060b" stop-opacity="0"/>
</radialGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#fff" stop-opacity="0.22"/>
  <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<style>
  .b0{animation:g0 1.5s cubic-bezier(.16,1,.3,1) 0.25s both}@keyframes g0{from{width:0}to{width:415.3px}}.p0{animation:fade 0.5s ease 0.55s both}.b1{animation:g1 1.5s cubic-bezier(.16,1,.3,1) 0.37s both}@keyframes g1{from{width:0}to{width:208.1px}}.p1{animation:fade 0.5s ease 0.67s both}.b2{animation:g2 1.5s cubic-bezier(.16,1,.3,1) 0.49s both}@keyframes g2{from{width:0}to{width:165.1px}}.p2{animation:fade 0.5s ease 0.79s both}.b3{animation:g3 1.5s cubic-bezier(.16,1,.3,1) 0.61s both}@keyframes g3{from{width:0}to{width:21.9px}}.p3{animation:fade 0.5s ease 0.91s both}.b4{animation:g4 1.5s cubic-bezier(.16,1,.3,1) 0.73s both}@keyframes g4{from{width:0}to{width:19.3px}}.p4{animation:fade 0.5s ease 1.03s both}.b5{animation:g5 1.5s cubic-bezier(.16,1,.3,1) 0.85s both}@keyframes g5{from{width:0}to{width:48.3px}}.p5{animation:fade 0.5s ease 1.15s both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .cell0,.cell1,.cell2,.cell3{animation:fade .5s ease both}
  .cell1{animation-delay:.08s} .cell2{animation-delay:.16s} .cell3{animation-delay:.24s}
  .shine{animation:slide 4.5s linear infinite}
  @keyframes slide{0%{transform:translateX(-320px)}100%{transform:translateX(1200px)}}
  @media (prefers-reduced-motion: reduce){
    .b0{animation:none;width:415.3px}.p0{animation:none;opacity:1}.b1{animation:none;width:208.1px}.p1{animation:none;opacity:1}.b2{animation:none;width:165.1px}.p2{animation:none;opacity:1}.b3{animation:none;width:21.9px}.p3{animation:none;opacity:1}.b4{animation:none;width:19.3px}.p4{animation:none;opacity:1}.b5{animation:none;width:48.3px}.p5{animation:none;opacity:1}
    .cell0,.cell1,.cell2,.cell3{animation:none;opacity:1}
    .shine{animation:none;opacity:0}
  }
</style>
</defs>

